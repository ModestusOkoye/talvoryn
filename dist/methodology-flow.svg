<svg xmlns="http://www.w3.org/2000/svg" width="960" height="285" viewBox="0 0 960 285" role="img" aria-labelledby="t d"><title id="t">How Intents activity relates to NEAR token economics</title><desc id="d">Intents swap activity may generate fees and recorded revenue. Revenue may fund purchases. Buyback wallet inflows and burns are compared separately with issuance. Buyback wallet inflows are not supply burns.</desc><rect width="960" height="285" rx="16" fill="#f5f8fc"/><g font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#102840" text-anchor="middle"><rect x="28" y="36" width="186" height="76" rx="12" fill="white" stroke="#afc4dc"/><text x="121" y="69">Intents swap</text><text x="121" y="94">activity</text><rect x="272" y="36" width="172" height="76" rx="12" fill="white" stroke="#afc4dc"/><text x="358" y="81">Fees</text><rect x="502" y="36" width="180" height="76" rx="12" fill="white" stroke="#afc4dc"/><text x="592" y="81">Revenue</text><rect x="740" y="36" width="192" height="76" rx="12" fill="white" stroke="#afc4dc"/><text x="836" y="69">Possible NEAR</text><text x="836" y="94">purchases</text><rect x="586" y="179" width="346" height="66" rx="12" fill="white" stroke="#afc4dc"/><text x="759" y="207">Buyback-wallet inflows</text><text x="759" y="230" font-size="14" font-weight="400">Not the same as burned NEAR</text></g><g stroke="#4386bc" stroke-width="2.8" fill="none" stroke-linecap="round"><path d="M214 74H263"/><path d="m255 67 8 7-8 7"/><path d="M444 74H493"/><path d="m485 67 8 7-8 7"/><path d="M682 74H731"/><path d="m723 67 8 7-8 7"/><path d="M836 113V170"/><path d="m829 162 7 8 7-8"/></g><text x="709" y="26" font-family="Arial,sans-serif" font-size="13" fill="#647a90">Depends on allocation and execution</text><text x="30" y="211" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#102840">Supply is measured separately</text><text x="30" y="238" font-family="Arial,sans-serif" font-size="15" fill="#5d7186">Gross issuance adds NEAR; burns remove NEAR.</text></svg>