name: Diagnose supply auth boundary (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OWNER_API_TOKEN: ${{ secrets.OWNER_API_TOKEN }}
    steps:
      - name: Compare authenticated and unauthenticated responses safely
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          base = "https://talvoryn-data.paulsimonmodus.workers.dev"
          token = os.environ.get("OWNER_API_TOKEN", "")
          if not token:
              print("GitHub token missing"); raise SystemExit(1)
          tests = [
              ("public health", "/api/health", False, "Mozilla/5.0"),
              ("revision without token", "/api/admin/revision/supply-daily", False, "Mozilla/5.0"),
              ("revision with token, Python UA", "/api/admin/revision/supply-daily", True, "Python-urllib/3.12"),
              ("revision with token, browser UA", "/api/admin/revision/supply-daily", True, "Mozilla/5.0"),
          ]
          for label, path, auth, ua in tests:
              headers = {"Accept":"application/json","User-Agent":ua}
              if auth: headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(base + path, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      status, body, ct = resp.status, resp.read(4096), resp.headers.get("Content-Type","")
              except urllib.error.HTTPError as exc:
                  status, body, ct = exc.code, exc.read(4096), exc.headers.get("Content-Type","")
              except Exception as exc:
                  print(label, "transport error type:",type(exc).__name__)
                  continue
              try:
                  obj=json.loads(body)
              except (ValueError,UnicodeDecodeError):
                  obj=None
              print(label, "| HTTP:",status,"| JSON:",isinstance(obj,dict),
                    "| hash valid:",isinstance(obj,dict) and isinstance(obj.get("hash"),str) and len(obj["hash"])==64,
                    "| content-type JSON:","json" in ct.lower())
          # No response bodies, tokens, hashes, or credentials are printed.
          PY
