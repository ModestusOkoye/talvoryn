name: Investigate failed NEAR supply runs

on:
  workflow_run:
    workflows:
      - Verify recent NEAR daily supply (staging)
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Existing NEAR supply run ID to diagnose (optional; defaults to latest failed run)'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: supply-incident-triage
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Investigate failure and maintain incident issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: python scripts/triage_supply_failure.py
      - name: Retain redacted triage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-incident-triage-${{ github.run_id }}
          path: supply-incident-triage.json
          if-no-files-found: warn
          retention-days: 14
