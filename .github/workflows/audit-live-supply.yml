name: Audit live NEAR supply before publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare live Cloudflare data with protected history and verified November totals
        run: python scripts/audit_live_supply.py
      - name: Upload audit results even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talvoryn-live-supply-audit-${{ github.run_id }}
          path: supply-live-audit.json
          if-no-files-found: warn
          retention-days: 14
