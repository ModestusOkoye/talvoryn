name: Test NEAR supply publishing safeguards (no writes)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/publish_verified_supply.py
      - scripts/test_publish_verified_supply.py
      - scripts/triage_supply_failure.py
      - scripts/test_triage_supply_failure.py
      - .github/workflows/test-supply-publisher.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile publisher and tests
        run: python -m py_compile scripts/publish_verified_supply.py scripts/test_publish_verified_supply.py scripts/triage_supply_failure.py scripts/test_triage_supply_failure.py
      - name: Run offline safety tests (no Cloudflare credentials or network calls)
        run: python scripts/test_publish_verified_supply.py
      - name: Run incident triage classifier tests (offline)
        run: python scripts/test_triage_supply_failure.py
