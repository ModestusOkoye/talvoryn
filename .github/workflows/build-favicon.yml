name: Build Talvoryn T favicon
on:
  push:
    paths:
      - .github/workflows/build-favicon.yml
      - dist/talvoryn-logo-transparent.png
  workflow_dispatch:
permissions:
  contents: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the original T brand mark
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          image=Image.open('dist/talvoryn-logo-transparent.png').convert('RGBA')
          if not (2.8 < image.width/image.height < 3.2):
            raise ValueError(f'Unexpected logo dimensions: {image.size}')
          # Original artwork: complete T mark fills the LEFT THIRD of the horizontal wordmark.
          # Prior gap detection cut through the two halves of the T itself.
          # Crop by the measured icon/letter boundary (approx x=725 of 2172), not a gap within the mark.
          end=round(image.width/3)
          mark=image.crop((0,0,end,image.height))
          mark=mark.crop(mark.getbbox())
          if not mark: raise ValueError('Empty T mark')
          mw,mh=mark.size
          side=512; inset=32
          scale=min((side-2*inset)/mw,(side-2*inset)/mh)
          mark=mark.resize((max(1,round(mw*scale)),max(1,round(mh*scale))),Image.Resampling.LANCZOS)
          result=Image.new('RGBA',(side,side),(0,0,0,0))
          result.alpha_composite(mark,((side-mark.width)//2,(side-mark.height)//2))
          result.save('dist/favicon.png')
          print(f'Original {image.size}; trimmed {original.size}; favicon mark {mw}x{mh}; split {end}; saved 512x512')
          PY
      - name: Commit favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/favicon.png
          git diff --cached --quiet || (git commit -m "Correct complete Talvoryn T favicon" && git push)
